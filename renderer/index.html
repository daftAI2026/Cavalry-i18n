<!--
  [INPUT]: 依赖 ./styles.css 与本地 Geist 字体提供离线视觉系统、./tauri-bridge.js 建立冻结 API、./ui-text.js 提供四语文案，并由 ./app.js 绑定真实业务状态
  [OUTPUT]: 对外提供原生 macOS 窗口控件下的可拖拽标题区、安装对象卡、语言主任务、三个独立维护动作、持久状态 Alert、更新 tooltip 与原生 alert dialog 锚点
  [POS]: renderer 的唯一视图骨架，被 Tauri WebView 直接加载；保留稳定 DOM id 作为测试与交互合同，不伪造交通灯或后端状态
  [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cavalry Language Switcher</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <a id="skipLink" class="skip-link" href="#mainContent">Skip to controls</a>

  <div class="window-surface">
    <header class="titlebar" data-tauri-drag-region>
      <div class="native-controls-space" aria-hidden="true" data-tauri-drag-region></div>
      <div class="titlebar-copy" data-tauri-drag-region>
        <span id="windowTitle" class="window-title" data-tauri-drag-region>Cavalry Language Switcher</span>
      </div>
      <span id="updateControl" class="tooltip-anchor" data-tooltip-state="closed" hidden>
        <button id="updateButton" type="button" class="update-button" aria-label="New version available" aria-describedby="updateTooltip">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
            <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm37.66-101.66a8,8,0,0,1-11.32,11.32L136,107.31V168a8,8,0,0,1-16,0V107.31l-18.34,18.35a8,8,0,0,1-11.32-11.32l32-32a8,8,0,0,1,11.32,0Z"></path>
          </svg>
        </button>
        <span id="updateTooltip" class="tooltip" role="tooltip">New version available</span>
      </span>
      <span id="updateAnnouncement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
    </header>

    <main id="mainContent" class="content">
      <section aria-labelledby="appVersion">
        <div class="installation-item">
          <div class="installation-main">
            <div class="installation-heading">
              <h1 id="appVersion" class="installation-name" translate="no">Cavalry not found</h1>
              <span id="currentLanguage" class="badge" data-state="unknown">English</span>
            </div>
            <p id="appPath" class="app-path">Choose a Cavalry installation to begin.</p>
            <span id="currentLabel" class="sr-only">Current</span>
            <span id="installationMode" class="sr-only"></span>
          </div>
          <button id="browseButton" type="button" class="button button-outline folder-button" aria-label="Choose Cavalry installation" disabled>
            <span class="folder-icon" aria-hidden="true">
              <svg class="folder-icon-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256" focusable="false">
                <path d="M216,72H131.31L104,44.69A15.86,15.86,0,0,0,92.69,40H40A16,16,0,0,0,24,56V200.62A15.4,15.4,0,0,0,39.38,216H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72ZM40,56H92.69l16,16H40ZM216,200H40V88H216Z"></path>
              </svg>
              <svg class="folder-icon-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256" focusable="false">
                <path d="M245,110.64A16,16,0,0,0,232,104H216V88a16,16,0,0,0-16-16H130.67L102.94,51.2a16.14,16.14,0,0,0-9.6-3.2H40A16,16,0,0,0,24,64V208h0a8,8,0,0,0,8,8H211.1a8,8,0,0,0,7.59-5.47l28.49-85.47A16.05,16.05,0,0,0,245,110.64ZM93.34,64,123.2,86.4A8,8,0,0,0,128,88h72v16H69.77a16,16,0,0,0-15.18,10.94L40,158.7V64Zm112,136H43.1l26.67-80H232Z"></path>
              </svg>
            </span>
          </button>
        </div>
      </section>

      <div class="separator" role="separator" aria-hidden="true"></div>

      <section class="language-section" aria-labelledby="languageSectionLabel">
        <div class="section-head">
          <h2 id="languageSectionLabel" class="section-title"><span id="switchToLabel">Switch to</span></h2>
        </div>
        <div class="language-control-row">
          <div class="select-wrap">
            <select id="languageSelect" aria-labelledby="languageSectionLabel" disabled></select>
          </div>
          <button id="applyButton" type="button" class="button button-primary" disabled>Apply &amp; Restart</button>
        </div>
      </section>

      <div class="separator" role="separator" aria-hidden="true"></div>

      <section aria-labelledby="maintenanceHeading">
        <div class="section-head">
          <h2 id="maintenanceHeading" class="section-title">Maintenance</h2>
        </div>
        <div class="maintenance-group" role="group" aria-labelledby="maintenanceHeading">
          <button id="extractButton" type="button" class="button button-outline" aria-label="Refresh English Snapshot" disabled>Refresh English</button>
          <button id="restoreEnglishButton" type="button" class="button button-outline" disabled>Restore English</button>
          <button id="restoreButton" type="button" class="button button-outline button-danger" hidden disabled>Restore Official</button>
        </div>
      </section>

      <section id="statusPanel" class="status-panel" data-tone="neutral" role="status" aria-labelledby="statusLabel" aria-describedby="statusText" aria-live="polite" aria-atomic="true">
        <span class="alert-icon" aria-hidden="true">
          <svg data-alert-icon="neutral" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
          <svg data-alert-icon="success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.2 2.2 4.8-5"></path></svg>
          <svg data-alert-icon="warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.8 2.6 17.3A2,2,0,0,0,4.3,20h15.4a2,2,0,0,0,1.7-2.7L13.7,3.8a2,2,0,0,0-3.4,0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
          <svg data-alert-icon="error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m9 9 6 6"></path><path d="m15 9-6 6"></path></svg>
        </span>
        <div class="status-copy">
          <h2 id="statusLabel" class="status-label">Status</h2>
          <p id="statusText" class="status-text">Ready.</p>
        </div>
        <button id="permissionButton" type="button" class="button button-outline permission-button" hidden>Open permission settings</button>
      </section>
    </main>
  </div>

  <dialog id="modalBackdrop" class="modal-backdrop" aria-labelledby="modalTitle" aria-describedby="modalBody">
    <section class="modal-dialog">
      <button id="modalCloseButton" type="button" class="modal-close" aria-label="Close">Close</button>
      <h2 id="modalTitle" class="modal-title"></h2>
      <p id="modalBody" class="modal-body"></p>
      <div class="modal-actions">
        <button id="modalSecondaryButton" type="button" class="button button-outline"></button>
        <button id="modalPrimaryButton" type="button" class="button button-primary"></button>
      </div>
    </section>
  </dialog>

  <script src="./tauri-bridge.js"></script>
  <script src="./ui-text.js"></script>
  <script src="./app.js"></script>
</body>

</html>

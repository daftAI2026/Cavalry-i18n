<!--
  [INPUT]: 依赖 tokens.css 及共享 shell/Activity/About/Toast/窗口控件视觉层，依赖 icons/select/tooltip/path/operation/update/toast/about/window-controls 状态机、冻结 bridge 与四语文案
  [OUTPUT]: 对外提供原生标题区、安装摘要、带占位态的 Select + Switch/Restore English 主任务流、三轨 Activity、必要 AlertDialog 与局部失败 Toast 的稳定语义锚点；About 内容由独立本地页面承载
  [POS]: renderer 的主窗口视图骨架，被 Tauri WebView 直接加载；保留稳定 DOM id 作为测试与交互合同，macOS About 由系统应用菜单唤起独立原生装饰窗口，Windows 只自绘原生语义按钮而不伪造系统外框
  [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cavalry Language Switcher</title>
  <link rel="stylesheet" href="./tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./operation-log.css" />
  <link rel="stylesheet" href="./toast.css" />
  <link rel="stylesheet" href="./about.css" />
  <link rel="stylesheet" href="./window-controls.css" />
</head>

<body>
  <a id="skipLink" class="skip-link" href="#mainContent">Skip to controls</a>

  <div class="window-surface">
    <header class="titlebar" data-tauri-drag-region>
      <div class="native-controls-space" aria-hidden="true" data-tauri-drag-region></div>
      <div class="titlebar-copy" data-tauri-drag-region>
        <span id="windowTitle" class="window-title" data-tauri-drag-region>Cavalry Language Switcher</span>
        <div id="updateControl" class="tooltip-anchor" data-slot="tooltip" data-tooltip-state="closed" hidden>
          <button id="updateButton" type="button" class="update-button" data-slot="tooltip-trigger" aria-label="New version available">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
              <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm37.66-101.66a8,8,0,0,1-11.32,11.32L136,107.31V168a8,8,0,0,1-16,0V107.31l-18.34,18.35a8,8,0,0,1-11.32-11.32l32-32a8,8,0,0,1,11.32,0Z"></path>
            </svg>
          </button>
          <div id="updateTooltip" class="tooltip" data-slot="tooltip-content" role="tooltip" aria-hidden="true">
            <span id="updateTooltipText" class="tooltip-copy">New version available</span>
            <div class="tooltip-arrow" data-slot="tooltip-arrow" aria-hidden="true"></div>
          </div>
        </div>
        <div id="aboutControl" class="tooltip-anchor" data-slot="tooltip" data-tooltip-state="closed" hidden>
          <button id="aboutButton" type="button" class="about-button" data-slot="tooltip-trigger" aria-label="About Cavalry Language Switcher">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path>
            </svg>
          </button>
          <div id="aboutTooltip" class="tooltip" data-slot="tooltip-content" role="tooltip" aria-hidden="true">
            <span id="aboutTooltipText" class="tooltip-copy">About</span>
            <div class="tooltip-arrow" data-slot="tooltip-arrow" aria-hidden="true"></div>
          </div>
        </div>
      </div>
      <span id="updateAnnouncement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
      <div id="windowsWindowControls" class="windows-window-controls" data-maximized="false" hidden>
        <button id="windowMinimizeButton" type="button" class="window-control-button" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M1.5 6.5h9"></path></svg>
        </button>
        <button id="windowMaximizeButton" type="button" class="window-control-button" aria-label="Maximize" title="Maximize">
          <svg class="window-icon-maximize" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><rect x="1.75" y="1.75" width="8.5" height="8.5"></rect></svg>
          <svg class="window-icon-restore" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M3.25 1.75h7v7h-2"></path><rect x="1.75" y="3.25" width="7" height="7"></rect></svg>
        </button>
        <button id="windowCloseButton" type="button" class="window-control-button window-control-close" aria-label="Close" title="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="m2 2 8 8M10 2 2 10"></path></svg>
        </button>
      </div>
    </header>

    <main id="mainContent" class="content">
      <section aria-labelledby="appVersion">
        <div class="installation-item">
          <div class="installation-main">
            <div class="installation-heading">
              <h1 id="appVersion" class="installation-name" translate="no">Cavalry not found</h1>
              <span id="currentLanguage" class="badge" data-kind="language">English</span>
              <span id="installationBadge" class="badge" data-kind="installation" data-state="unknown" hidden></span>
            </div>
            <p id="appPath" class="app-path" data-display="message" aria-label="Choose a Cavalry installation to begin.">
              <span id="appPathPrefix" class="app-path-prefix" aria-hidden="true">Choose a Cavalry installation to begin.</span>
              <span id="appPathLeaf" class="app-path-leaf" aria-hidden="true"></span>
            </p>
            <span id="currentLabel" class="sr-only">Current</span>
            <span id="installationMode" class="sr-only"></span>
          </div>
          <button id="browseButton" type="button" class="button button-outline folder-button" aria-label="Choose Cavalry installation" disabled>
            <span class="folder-icon" aria-hidden="true">
              <svg class="folder-icon-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256" focusable="false">
                <path d="M216,72H131.31L104,44.69A15.86,15.86,0,0,0,92.69,40H40A16,16,0,0,0,24,56V200.62A15.4,15.4,0,0,0,39.38,216H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72ZM40,56H92.69l16,16H40ZM216,200H40V88H216Z"></path>
              </svg>
              <svg class="folder-icon-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256" focusable="false">
                <path d="M245,110.64A16,16,0,0,0,232,104H216V88a16,16,0,0,0-16-16H130.67L102.94,51.2a16.14,16.14,0,0,0-9.6-3.2H40A16,16,0,0,0,24,64V208h0a8,8,0,0,0,8,8H211.1a8,8,0,0,0,7.59-5.47l28.49-85.47A16.05,16.05,0,0,0,245,110.64ZM93.34,64,123.2,86.4A8,8,0,0,0,128,88h72v16H69.77a16,16,0,0,0-15.18,10.94L40,158.7V64Zm112,136H43.1l26.67-80H232Z"></path>
              </svg>
            </span>
          </button>
        </div>
      </section>

      <section class="language-section" aria-labelledby="languageSectionLabel">
        <div class="section-head">
          <h2 id="languageSectionLabel" class="section-title"><span id="switchToLabel">Switch to</span></h2>
        </div>
        <div class="language-control-row">
          <div id="languageSelectRoot" class="select-root" data-state="closed">
            <select id="languageSelect" class="sr-only" tabindex="-1" aria-hidden="true" disabled></select>
            <button id="languageSelectTrigger" type="button" class="select-trigger" role="combobox" aria-labelledby="languageSectionLabel languageSelectValue" aria-haspopup="listbox" aria-expanded="false" aria-controls="languageSelectList" disabled>
              <span id="languageSelectValue" class="select-value" data-placeholder="true">Choose a language</span>
              <span class="select-chevron" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <path d="m6 9 6 6 6-6"></path>
                </svg>
              </span>
            </button>
            <div id="languageSelectPopup" class="select-popup" hidden>
              <div id="languageSelectList" class="select-list" role="listbox" aria-labelledby="languageSectionLabel"></div>
            </div>
          </div>
          <button id="applyButton" type="button" class="button button-primary" disabled>Switch</button>
          <button id="restoreButton" type="button" class="button button-outline" disabled>Restore English</button>
        </div>
      </section>

      <section id="statusPanel" class="status-panel" data-state="neutral" aria-labelledby="statusLabel">
        <h2 id="statusLabel" class="sr-only">Operation progress</h2>
        <div class="status-task-shell">
          <p id="statusIdle" class="status-idle-message"></p>
          <p id="statusIntro" class="status-message status-intro" hidden></p>
          <div id="statusViewport" class="status-viewport">
            <ol id="statusText" class="status-text" role="log" aria-live="polite" aria-relevant="additions text"></ol>
          </div>
          <p id="statusOutcome" class="status-message status-outcome" role="status" aria-live="polite" hidden></p>
        </div>
        <button id="permissionButton" type="button" class="button button-outline permission-button" hidden>Open permission settings</button>
      </section>
    </main>
  </div>

  <dialog id="modalBackdrop" class="modal-backdrop" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
    <section class="modal-dialog">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title"></h2>
        <p id="modalBody" class="modal-body"></p>
      </div>
      <div class="modal-actions">
        <button id="modalSecondaryButton" type="button" class="button button-outline"></button>
        <button id="modalPrimaryButton" type="button" class="button button-primary"></button>
      </div>
    </section>
  </dialog>

  <script src="./tauri-bridge.js"></script>
  <script src="./ui-text.js"></script>
  <script src="./icons.js"></script>
  <script src="./select-control.js"></script>
  <script src="./tooltip-control.js"></script>
  <script src="./path-display.js"></script>
  <script src="./operation-log.js"></script>
  <script src="./update-progress.js"></script>
  <script src="./toast-control.js"></script>
  <script src="./about-control.js"></script>
  <script src="./window-controls.js"></script>
  <script src="./app.js"></script>
</body>

</html>

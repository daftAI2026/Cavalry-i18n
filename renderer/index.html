<!--
  [INPUT]: 依赖 ./styles.css 提供布局样式、./tauri-bridge.js 建立冻结 API、./ui-text.js 提供稳定文案，并由 ./app.js 绑定界面行为与状态同步
  [OUTPUT]: 对外提供跨平台桌面补丁器渲染层的静态 DOM 结构、macOS 官方/受管安装态、英文快照/恢复入口、独立官方还原入口、可本地化状态标签、权限弹窗及控件锚点
  [POS]: renderer 的视图骨架，被 Tauri WebView 直接加载
  [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cavalry Language Switcher</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="grain"></div>

  <main class="app-shell">
    <div class="app-card">
      <div>
        <p id="appVersion" class="app-version">Cavalry not found</p>
        <p id="appPath" class="app-path">Choose a Cavalry installation to begin.</p>
      </div>
      <button id="browseButton" type="button" class="icon-button" aria-label="Choose Cavalry installation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
        </svg>
      </button>
    </div>

    <div class="divider"></div>

    <div id="languageSectionLabel" class="section-label">Language</div>
    <p class="current-row"><span id="currentLabel">Current</span> — <strong id="currentLanguage">English</strong></p>
    <p id="installationMode" class="installation-mode"></p>

    <label class="field">
      <span id="switchToLabel">Switch to</span>
      <select id="languageSelect"></select>
    </label>

    <div class="actions">
      <button id="applyButton" type="button" class="primary">Apply & Restart</button>
      <button id="extractButton" type="button" class="secondary">Refresh English</button>
      <button id="restoreEnglishButton" type="button" class="secondary" disabled>Restore English</button>
    </div>
    <button id="restoreButton" type="button" class="secondary restore-button" hidden>Restore official Cavalry</button>

    <div class="divider"></div>

    <section class="status-panel">
      <p id="statusLabel" class="status-label">Status</p>
      <p id="statusText" class="status-text">Ready.</p>
      <button id="permissionButton" type="button" class="permission-button" hidden>Open permission settings</button>
    </section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="modalCloseButton" type="button" class="modal-close" aria-label="Close">×</button>
      <h2 id="modalTitle" class="modal-title"></h2>
      <p id="modalBody" class="modal-body"></p>
      <div class="modal-actions">
        <button id="modalSecondaryButton" type="button" class="secondary"></button>
        <button id="modalPrimaryButton" type="button" class="primary"></button>
      </div>
    </section>
  </div>

  <script src="./tauri-bridge.js"></script>
  <script src="./ui-text.js"></script>
  <script src="./app.js"></script>
</body>

</html>

<!--
  [INPUT]: 依赖 ./styles.css 与本地 Geist 字体提供视觉系统、./tauri-bridge.js 建立冻结 API、./ui-text.js 提供稳定文案，并由 ./app.js 绑定界面行为与状态同步
  [OUTPUT]: 对外提供跨平台桌面补丁器渲染层的对象、主任务、维护、反馈四级语义 DOM，初始化默认禁用的业务控件、仅在更新可用时出现的单一图标/tooltip 与无障碍通知、macOS 官方/受管安装态、英文快照/恢复入口、独立官方还原入口、可本地化状态标签、权限弹窗及固定控件锚点
  [POS]: renderer 的视图骨架，被 Tauri WebView 直接加载；以安装对象为顶部上下文、语言应用为唯一主任务、英文维护为次级动作、状态为末端反馈
  [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cavalry Language Switcher</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <a id="skipLink" class="skip-link" href="#mainContent">Skip to controls</a>

  <main id="mainContent" class="app-shell">
    <header class="app-header">
      <div class="app-identity">
        <h1 id="appVersion" class="app-version">Cavalry not found</h1>
        <p id="appPath" class="app-path">Choose a Cavalry installation to begin.</p>
        <p id="installationMode" class="installation-mode"></p>
      </div>
      <div class="app-actions">
        <span id="updateControl" class="tooltip-anchor" data-tooltip-state="closed" hidden>
          <button id="updateButton" type="button" class="icon-button update-button" aria-label="New version available" aria-describedby="updateTooltip">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
              <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm37.66-101.66a8,8,0,0,1-11.32,11.32L136,107.31V168a8,8,0,0,1-16,0V107.31l-18.34,18.35a8,8,0,0,1-11.32-11.32l32-32a8,8,0,0,1,11.32,0Z"></path>
            </svg>
          </button>
          <span id="updateTooltip" class="tooltip" role="tooltip">New version available</span>
        </span>
        <span id="updateAnnouncement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
        <button id="browseButton" type="button" class="icon-button" aria-label="Choose Cavalry installation" disabled>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
          </svg>
        </button>
      </div>
    </header>

    <div class="divider"></div>

    <section class="language-section" aria-labelledby="languageSectionLabel">
      <div class="section-heading">
        <h2 id="languageSectionLabel" class="section-label">Language</h2>
        <p class="current-row">
          <span id="currentLabel">Current</span>
          <strong id="currentLanguage">English</strong>
        </p>
      </div>

      <label class="field">
        <span id="switchToLabel">Switch to</span>
        <select id="languageSelect" disabled></select>
      </label>

      <div class="task-actions">
        <button id="applyButton" type="button" class="primary" disabled>Apply & Restart</button>
        <div class="maintenance-actions">
          <button id="extractButton" type="button" class="secondary" aria-label="Refresh English Snapshot" disabled>Refresh English</button>
          <button id="restoreEnglishButton" type="button" class="secondary" disabled>Restore English</button>
        </div>
        <button id="restoreButton" type="button" class="secondary restore-button" hidden disabled>Restore official Cavalry</button>
      </div>
    </section>

    <div class="divider"></div>

    <section class="status-panel" aria-labelledby="statusLabel">
      <h2 id="statusLabel" class="status-label">Status</h2>
      <p id="statusText" class="status-text" role="status" aria-live="polite" aria-atomic="true">Ready.</p>
      <button id="permissionButton" type="button" class="permission-button" hidden>Open permission settings</button>
    </section>
  </main>

  <dialog id="modalBackdrop" class="modal-backdrop" aria-labelledby="modalTitle" aria-describedby="modalBody">
    <section class="modal-dialog">
      <button id="modalCloseButton" type="button" class="modal-close" aria-label="Close">×</button>
      <h2 id="modalTitle" class="modal-title"></h2>
      <p id="modalBody" class="modal-body"></p>
      <div class="modal-actions">
        <button id="modalSecondaryButton" type="button" class="secondary"></button>
        <button id="modalPrimaryButton" type="button" class="primary"></button>
      </div>
    </section>
  </dialog>

  <script src="./tauri-bridge.js"></script>
  <script src="./ui-text.js"></script>
  <script src="./app.js"></script>
</body>

</html>

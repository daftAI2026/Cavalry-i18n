name: Build Tauri App

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm install

      - name: Validate project version metadata
        run: npm run check:version

      - name: Validate app contracts
        run: npm run test:contracts

      - name: Validate app syntax
        run: npm run check:app

      - name: Prepare translation gate outputs
        run: mkdir -p "$RUNNER_TEMP/translation-gates"

      - name: Validate translation quality
        id: translation_gates
        run: |
          python3 tools/validate_translations.py \
            --root . \
            --json-report "$RUNNER_TEMP/translation-gates/report.json" \
            --markdown-summary "$RUNNER_TEMP/translation-gates/runlog.md"

      - name: Publish translation gate summary
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/translation-gates/runlog.md" ]; then
            cat "$RUNNER_TEMP/translation-gates/runlog.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Translation quality runlog"
              echo
              echo "**Result:** FAIL"
              echo
              echo "- Validator did not produce a markdown summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload translation gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: translation-quality-report
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/translation-gates/report.json
            ${{ runner.temp }}/translation-gates/runlog.md

      - name: Record full-ui gate status
        if: ${{ always() }}
        run: |
          {
            echo "# Full UI gate"
            echo
            echo "- BLOCKED-NO-LIVE-CAVALRY"
            echo "- GitHub Actions does not run live Cavalry capture; use a session-scoped local run before translation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app source artifact
        uses: actions/upload-artifact@v4
        with:
          name: cavalry-i18n-tauri-source
          path: |
            renderer/
            injector/
            resources/
            src-tauri/
            languages/
            README.md
            LICENSE
            package.json
            package-lock.json
            tools/build_translator_injector.sh
            tools/cavalry_qt_target.json
            tools/check_app_contracts.js
            tools/extract_compiled_ui_strings.js
            tools/generate_embedded_translations.js
            tools/ja_JP.ts
            tools/launch_cavalry_with_injector.sh
            tools/resolve_cavalry_qt_sdk.js
            tools/translation-whitelist.json
            tools/validate_translations.py
            tools/zh-Hans.ts
            tools/zh-Hant.ts

  package_macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Qt installer Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/aqt-venv/bin/python" -m pip install aqtinstall
          echo "PYTHON=$RUNNER_TEMP/aqt-venv/bin/python" >> "$GITHUB_ENV"

      - name: Install app dependencies
        run: npm install

      - name: Validate project version metadata
        run: npm run check:version

      - name: Prepare target Qt SDK for injector build
        run: npm run prepare:qt-sdk

      - name: Build packaged macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          unset CI
          npm run tauri:build
          bash tools/stamp_dmg_icon.sh src-tauri/target/release/bundle/dmg

      - name: Validate packaged app with LOCAL_BUILD_SOP gates
        run: |
          npm run check:app
          npm run test:contracts
          npm run check:tauri
          npm run test:tauri
          npm run test:tauri:packaged
          npm run test:tauri:dmg-layout

      - name: Upload packaged macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cavalry-patcher-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/Cavalry Language Switcher.app
            src-tauri/target/release/bundle/cavalry-i18n-tauri-size-report.json
            injector/libCavalryTranslatorInjector.dylib

  release:
    needs: [build, package_macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packaged macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: cavalry-patcher-macos
          path: dist

      - name: Write GitHub Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          ## Cavalry Language Switcher

          Cavalry Language Switcher 是一个面向 Cavalry 2.7.2 的 macOS 语言切换工具。它可以把本机已安装的 Cavalry 在 English、简体中文、繁體中文、日本語之间切换，并继续从原来的 \`Cavalry.app\` 启动。

          它会处理两类翻译表面：Cavalry 的 JSON 资源文件，以及内置在 Qt/UI 二进制里的菜单、面板、按钮和控件文字。应用语言时，工具会 patch 本地 Cavalry app bundle，安装 runtime injector，重新签名，并清理 Gatekeeper quarantine。

          Cavalry Language Switcher 是独立社区工具，不隶属于 Scene Group、Cavalry 或 Canva。

          ## 下载

          ### macOS
          - Apple M 芯片：下载下方 \`Cavalry.Language.Switcher_${version}_aarch64.dmg\`

          ## 支持语言
          - English
          - 简体中文
          - 繁體中文
          - 日本語

          ## 使用前须知
          - 首次应用语言包时，macOS 可能要求授予 App Management 权限。
          - 建议保留一份干净的 Cavalry 安装包或备份；恢复到完全原始状态时，重新安装 Cavalry 是最稳妥的方式。
          - 当前 release 只发布 macOS Apple Silicon 版本。
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cavalry Language Switcher ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/**/*.dmg

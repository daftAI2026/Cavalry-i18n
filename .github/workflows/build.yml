name: Build Language Pack

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare translation gate outputs
        run: mkdir -p "$RUNNER_TEMP/translation-gates"

      - name: Validate translation quality
        id: translation_gates
        run: |
          python3 tools/validate_translations.py \
            --root . \
            --json-report "$RUNNER_TEMP/translation-gates/report.json" \
            --markdown-summary "$RUNNER_TEMP/translation-gates/runlog.md"

      - name: Publish translation gate summary
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/translation-gates/runlog.md" ]; then
            cat "$RUNNER_TEMP/translation-gates/runlog.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Translation quality runlog"
              echo
              echo "**Result:** FAIL"
              echo
              echo "- Validator did not produce a markdown summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload translation gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: translation-quality-report
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/translation-gates/report.json
            ${{ runner.temp }}/translation-gates/runlog.md

      - name: Install Qt tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qttools5-dev-tools

      - name: Compile .ts to .qm with lrelease
        run: |
          for TS in tools/*.ts; do
            LANG=$(basename "$TS" .ts)
            lrelease "$TS" -qm "languages/$LANG/cavalry_${LANG}.qm"
          done

      - name: Verify .qm files
        run: |
          for LANG in zh-Hans zh-Hant ja_JP; do
            for QM in \
              "languages/$LANG/cavalry_${LANG}.qm" \
              "languages/$LANG/qtbase_${LANG}.qm"; do
              if [ ! -f "$QM" ]; then
                echo "FAIL: $QM not found"; exit 1
              fi
              SIZE=$(wc -c < "$QM" | tr -d ' ')
              if [ "$SIZE" -le 0 ]; then
                echo "FAIL: $QM is empty"; exit 1
              fi
              echo "$QM: ${SIZE} bytes"
            done
          done

      - name: Upload language pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: cavalry-language-pack
          path: |
            languages/
            LanguageSwitcher.js

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qttools5-dev-tools

      - name: Compile .ts to .qm with lrelease
        run: |
          for TS in tools/*.ts; do
            LANG=$(basename "$TS" .ts)
            lrelease "$TS" -qm "languages/$LANG/cavalry_${LANG}.qm"
          done

      - name: Verify .qm files
        run: |
          for LANG in zh-Hans zh-Hant ja_JP; do
            for QM in \
              "languages/$LANG/cavalry_${LANG}.qm" \
              "languages/$LANG/qtbase_${LANG}.qm"; do
              if [ ! -f "$QM" ]; then
                echo "FAIL: $QM not found"; exit 1
              fi
              SIZE=$(wc -c < "$QM" | tr -d ' ')
              if [ "$SIZE" -le 0 ]; then
                echo "FAIL: $QM is empty"; exit 1
              fi
              echo "$QM: ${SIZE} bytes"
            done
          done

      - name: Package release
        run: |
          mkdir -p release-pack
          cp LanguageSwitcher.js release-pack/
          cp -r languages release-pack/
          cd release-pack && zip -r ../cavalry-i18n-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cavalry-i18n-${{ github.ref_name }}.zip
          generate_release_notes: true

# [INPUT]: 依赖仓库版本、CHANGELOG、release.config、跨平台 Tauri 配置、Qt generic/QPA 构建入口、Windows NSIS provenance sidecar 与 GitHub tag/artifact 环境
# [OUTPUT]: 对外提供不夹带原生构建物的源码闭包、Node/翻译合同、平台 Runner 现场生成的 Windows 双 DLL 与 macOS dylib、带当前输入 provenance 的 NSIS 隔离安装卸载门、双架构 macOS 包、精确版本更新摘要、跨平台 GitHub Release 与 README badge 写回
# [POS]: .github/workflows 的唯一 CI/CD 编排器，将仓库源码真相分别投影为 Windows NSIS 与 macOS 发布包，发布边界只交付 EXE/DMG 而不把中间原生库伪装成源码或独立产品资产
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Build Tauri App

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['cavalry-*-p*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Validate project version metadata
        run: npm run check:version

      - name: Validate release protocol
        run: npm run check:release

      - name: Validate app contracts
        run: npm run test:contracts

      - name: Validate app syntax
        run: npm run check:app

      - name: Prepare translation gate outputs
        run: mkdir -p "$RUNNER_TEMP/translation-gates"

      - name: Validate translation quality
        id: translation_gates
        run: |
          python3 tools/validate_translations.py \
            --root . \
            --json-report "$RUNNER_TEMP/translation-gates/report.json" \
            --markdown-summary "$RUNNER_TEMP/translation-gates/runlog.md"

      - name: Publish translation gate summary
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/translation-gates/runlog.md" ]; then
            cat "$RUNNER_TEMP/translation-gates/runlog.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Translation quality runlog"
              echo
              echo "**Result:** FAIL"
              echo
              echo "- Validator did not produce a markdown summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload translation gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: translation-quality-report
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/translation-gates/report.json
            ${{ runner.temp }}/translation-gates/runlog.md

      - name: Record full-ui gate status
        if: ${{ always() }}
        run: |
          {
            echo "# Full UI gate"
            echo
            echo "- BLOCKED-NO-LIVE-CAVALRY"
            echo "- GitHub Actions does not run live Cavalry capture; use a session-scoped local run before translation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app source artifact
        uses: actions/upload-artifact@v4
        with:
          name: cavalry-i18n-tauri-source
          path: |
            renderer/
            injector/
            !injector/**/*.dll
            !injector/**/*.dylib
            resources/
            src-tauri/
            languages/
            README.md
            CHANGELOG.md
            LICENSE
            package.json
            package-lock.json
            release.config.json
            .gitattributes
            tools/
          include-hidden-files: true

  windows_check:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install app dependencies
        run: npm ci

      - name: Validate project metadata and app contracts
        run: |
          npm run check:version
          npm run check:release
          npm run check:app
          npm run test:contracts

      - name: Build Windows runtime trust anchors
        run: |
          npm run prepare:qt-sdk:windows
          npm run build:injector:windows

      - name: Check and test the Windows Rust target
        run: |
          npm run check:tauri
          npm run test:tauri

      - name: Build the Windows NSIS installer
        run: npm run build:tauri:windows

      - name: Install and uninstall the Windows NSIS package
        run: npm run test:tauri:windows-nsis

      - name: Upload the Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: cavalry-i18n-windows-nsis
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.provenance.json
          if-no-files-found: error

  package_macos:
    if: startsWith(github.ref, 'refs/tags/cavalry-') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: aarch64
            rust_target: aarch64-apple-darwin
            expected_arch: arm64
          - label: x64
            rust_target: x86_64-apple-darwin
            expected_arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target for ${{ matrix.label }}
        run: rustup target add ${{ matrix.rust_target }}

      - name: Set up Qt installer Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/aqt-venv/bin/python" -m pip install aqtinstall
          echo "PYTHON=$RUNNER_TEMP/aqt-venv/bin/python" >> "$GITHUB_ENV"

      - name: Install app dependencies
        run: npm ci

      - name: Validate project version metadata
        run: npm run check:version

      - name: Validate release protocol
        run: npm run check:release

      - name: Resolve release metadata
        if: startsWith(github.ref, 'refs/tags/cavalry-')
        run: npm run release:metadata -- --github-env

      - name: Prepare target Qt SDK for injector build
        run: npm run prepare:qt-sdk

      - name: Build packaged macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          unset CI
          npm run tauri:build -- --target ${{ matrix.rust_target }}
          bash tools/stamp_dmg_icon.sh src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg

      - name: Name release DMG asset
        if: startsWith(github.ref, 'refs/tags/cavalry-')
        run: |
          dmg_dir="src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg"
          case "${{ matrix.label }}" in
            aarch64) release_asset_name="$RELEASE_ASSET_NAME_AARCH64" ;;
            x64) release_asset_name="$RELEASE_ASSET_NAME_X64" ;;
            *) echo "Unknown release asset label: ${{ matrix.label }}" >&2; exit 1 ;;
          esac
          source_dmg="$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$source_dmg" ]; then
            echo "No DMG found in $dmg_dir" >&2
            exit 1
          fi
          mv "$source_dmg" "$dmg_dir/$release_asset_name"

      - name: Validate packaged app with LOCAL_BUILD_SOP gates
        run: |
          bundle_root="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          app_path="$bundle_root/macos/Cavalry Language Switcher.app"
          npm run check:app
          npm run test:contracts
          npm run check:tauri
          npm run test:tauri
          PACKAGED_APP_PATH="$app_path" PACKAGED_EXPECTED_ARCH="${{ matrix.expected_arch }}" npm run test:tauri:packaged
          bash tools/check_dmg_layout.sh "$bundle_root/dmg"

      - name: Upload packaged macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cavalry-patcher-macos-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Cavalry Language Switcher.app
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/cavalry-i18n-tauri-size-report.json

  release:
    needs: [build, windows_check, package_macos]
    if: startsWith(github.ref, 'refs/tags/cavalry-')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packaged macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cavalry-patcher-macos-*
          path: dist

      - name: Download packaged Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cavalry-i18n-windows-nsis
          path: dist/windows

      - name: Resolve release metadata
        run: npm run release:metadata -- --github-env

      - name: Name Windows release asset
        run: |
          mapfile -d '' -t windows_installers < <(find dist/windows -type f -name '*.exe' -print0)
          if [ "${#windows_installers[@]}" -ne 1 ]; then
            echo "Expected exactly one Windows NSIS installer, found ${#windows_installers[@]}" >&2
            exit 1
          fi
          mv "${windows_installers[0]}" "dist/$RELEASE_ASSET_NAME_WINDOWS_X64"

      - name: Extract version changelog
        run: |
          node tools/extract_release_changelog.js \
            --version "$INTERNAL_APP_VERSION" \
            --changelog CHANGELOG.md \
            --output release-changes.md

      - name: Write GitHub Release notes
        run: |
          {
            cat <<EOF
          ## Cavalry Language Switcher

          Cavalry Language Switcher 是一个面向 Cavalry ${TARGET_CAVALRY_VERSION} 的 macOS 与 Windows 语言切换工具。它可以把本机已安装的 Cavalry 在 English、简体中文、繁體中文、日本語之间切换，并继续从原来的 Cavalry 应用启动。

          它会处理两类翻译表面：Cavalry 的 JSON 资源文件，以及内置在 Qt/UI 二进制里的菜单、面板、按钮和控件文字。Windows 版动态发现或由用户选择 Cavalry 安装目录，不依赖固定盘符，并部署 Qt generic translator 与原厂 QPA 委托层，让原桌面、开始菜单、任务栏及直接 EXE 启动保持不变；macOS 版 patch 本地 app bundle、安装 runtime injector、重新签名并清理 Gatekeeper quarantine。

          Cavalry Language Switcher 是独立社区工具，不隶属于 Scene Group、Cavalry 或 Canva。

          ## p${RELEASE_PATCH} 更新内容 / Changes
          EOF
            cat release-changes.md
            cat <<EOF

          ## 下载

          ### macOS
          - [Apple M 芯片](https://github.com/daftAI2026/Cavalry-i18n/releases/download/${GITHUB_REF_NAME}/${RELEASE_ASSET_NAME_AARCH64}) | [Intel 芯片](https://github.com/daftAI2026/Cavalry-i18n/releases/download/${GITHUB_REF_NAME}/${RELEASE_ASSET_NAME_X64})

          ### Windows
          - [Windows x64 安装器](https://github.com/daftAI2026/Cavalry-i18n/releases/download/${GITHUB_REF_NAME}/${RELEASE_ASSET_NAME_WINDOWS_X64})

          ### macOS 首次打开
          当前 DMG 使用 ad-hoc 签名，尚未经过 Apple Developer ID notarization。如果从浏览器下载后，macOS 提示 "Apple could not verify Cavalry Language Switcher is free of malware"，请先把应用拖入 Applications，然后运行：

          \`\`\`bash
          xattr -dr com.apple.quarantine "/Applications/Cavalry Language Switcher.app"
          open "/Applications/Cavalry Language Switcher.app"
          \`\`\`

          开发者也可以按仓库内的 \`LOCAL_BUILD_SOP.md\` 从源码本地构建；本地构建产物不会携带浏览器下载写入的 quarantine 标记。

          可把这段话发给你的 AI agent：

          \`\`\`text
          请从源码本地构建 Cavalry Language Switcher：

          1. 打开仓库 /Users/luo/Desktop/ClaudeCode/web/Cavalry-i18n。
          2. 严格按照 LOCAL_BUILD_SOP.md 执行。
          3. 运行标准 Tauri build、执行 DMG 卷宗图标盖章，并运行 SOP 里的 packaged checks。
          4. 完成后告诉我最终 DMG 路径。
          \`\`\`

          ## 支持语言
          - English
          - 简体中文
          - 繁體中文
          - 日本語

          ## 使用前须知
          - 当前 release 尚未经过 Apple Developer ID notarization；浏览器下载后首次打开可能需要手动清除 quarantine。
          - 首次应用语言包时，macOS 可能要求授予 App Management 权限。
          - Windows 版不要求 Cavalry 位于固定盘符；自动检测失败时可在应用内选择安装目录，写入受保护目录时可能请求 UAC 提权。
          - 建议保留一份干净的 Cavalry 安装包或备份；恢复到完全原始状态时，重新安装 Cavalry 是最稳妥的方式。
          - 当前 release 同时发布 Windows x64 安装器与 macOS Apple Silicon/Intel 两个 DMG，请按平台和芯片类型下载。

          ## 日本語

          Cavalry Language Switcher は、Cavalry ${TARGET_CAVALRY_VERSION} 向けの macOS / Windows 用言語切り替えツールです。インストール済みの Cavalry を English、簡体字中国語、繁体字中国語、日本語の間で切り替えられます。

          初回適用時に macOS の App Management 権限が求められる場合があります。完全に元の状態へ戻すには、Cavalry を再インストールするのが最も安全です。

          ## English

          Cavalry Language Switcher is an independent community tool for switching the UI language of Cavalry ${TARGET_CAVALRY_VERSION} on macOS and Windows. It is not affiliated with Scene Group, Cavalry, or Canva.
          EOF
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' -t dmg_assets < <(find dist -type f -name '*.dmg' -print0)
          if [ "${#dmg_assets[@]}" -ne 2 ]; then
            echo "Expected two DMG assets, found ${#dmg_assets[@]}" >&2
            exit 1
          fi
          windows_asset="dist/$RELEASE_ASSET_NAME_WINDOWS_X64"
          if [ ! -f "$windows_asset" ]; then
            echo "Windows NSIS asset is missing: $windows_asset" >&2
            exit 1
          fi
          assets=("${dmg_assets[@]}" "$windows_asset")
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$RELEASE_TITLE" --notes-file release-notes.md

      - name: Update README release badge endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout -B main origin/main
          mkdir -p docs/badges
          cat > docs/badges/release.json <<EOF
          {
            "schemaVersion": 1,
            "label": "release",
            "message": "${GITHUB_REF_NAME}",
            "color": "blue"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/release.json
          if git diff --cached --quiet; then
            echo "Release badge endpoint already points at ${GITHUB_REF_NAME}."
            exit 0
          fi
          git commit -m "docs: update release badge for ${GITHUB_REF_NAME}"
          git push origin HEAD:main

name: Build Desktop Patcher

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop patcher dependencies
        run: npm install

      - name: Validate desktop patcher contract
        run: npm run test:desktop

      - name: Validate desktop patcher syntax
        run: npm run check:desktop

      - name: Prepare translation gate outputs
        run: mkdir -p "$RUNNER_TEMP/translation-gates"

      - name: Validate translation quality
        id: translation_gates
        run: |
          python3 tools/validate_translations.py \
            --root . \
            --json-report "$RUNNER_TEMP/translation-gates/report.json" \
            --markdown-summary "$RUNNER_TEMP/translation-gates/runlog.md"

      - name: Publish translation gate summary
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/translation-gates/runlog.md" ]; then
            cat "$RUNNER_TEMP/translation-gates/runlog.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Translation quality runlog"
              echo
              echo "**Result:** FAIL"
              echo
              echo "- Validator did not produce a markdown summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload translation gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: translation-quality-report
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/translation-gates/report.json
            ${{ runner.temp }}/translation-gates/runlog.md

      - name: Upload desktop patcher source artifact
        uses: actions/upload-artifact@v4
        with:
          name: cavalry-i18n-desktop-source
          path: |
            desktop-patcher/
            languages/
            doc/translation-whitelist.json
            README.md
            LICENSE
            package.json
            package-lock.json
            tools/build_translator_injector.sh
            tools/check_electron_patcher_ui.js
            tools/generate_embedded_translations.js
            tools/ja_JP.ts
            tools/launch_cavalry_with_injector.sh
            tools/validate_translations.py
            tools/zh-Hans.ts
            tools/zh-Hant.ts

  package_macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop patcher dependencies
        run: npm install

      - name: Install Qt 6.6.3 for injector build
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'

      - name: Build packaged macOS patcher
        env:
          CAVALRY_QT_VERSION: 6.6.3
        run: npm run build

      - name: Upload packaged macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cavalry-patcher-macos
          path: |
            dist/*.dmg
            dist/*.zip
            desktop-patcher/injector/libCavalryTranslatorInjector.dylib

  release:
    needs: [build, package_macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packaged macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: cavalry-patcher-macos
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.zip
          generate_release_notes: true

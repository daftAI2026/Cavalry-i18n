<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cavalry Language Switcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="grain"></div>

    <main class="app-shell">
      <header class="hero">
        <div class="hero-rule"></div>
        <p class="eyebrow">json patcher</p>
        <h1>Language<br />Switcher</h1>
        <p class="subcopy">Patch installed assets. Relaunch. Done.</p>
      </header>

      <section class="panel">
        <div class="section-label">Target</div>
        <div class="app-card">
          <div>
            <p id="appVersion" class="app-version">Cavalry not found</p>
            <p id="appPath" class="app-path">Choose a Cavalry.app to begin.</p>
          </div>
          <button id="browseButton" type="button" class="icon-button" aria-label="Choose Cavalry app">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </button>
        </div>

        <div class="divider"></div>

        <div class="section-label">Language</div>
        <p class="current-row">Active — <strong id="currentLanguage">English</strong></p>

        <label class="field">
          <span>Switch to</span>
          <select id="languageSelect"></select>
        </label>

        <div class="actions">
          <button id="applyButton" type="button" class="primary">Apply & Restart</button>
          <button id="extractButton" type="button" class="secondary">Refresh English</button>
        </div>

        <div class="divider"></div>

        <section class="status-panel">
          <p class="status-label">sys.out</p>
          <p id="statusText" class="status-text">Ready.</p>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cavalry Language Switcher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Desktop-only JSON patcher</p>
        <h1>🌐 Cavalry Language Switcher</h1>
        <p class="subcopy">Pick a language, patch the installed JSON assets, and relaunch Cavalry.</p>
      </header>

      <section class="panel">
        <div class="app-card">
          <div>
            <p id="appVersion" class="app-version">Cavalry not found</p>
            <p id="appPath" class="app-path">Choose a Cavalry.app to begin.</p>
          </div>
          <button id="browseButton" type="button" class="icon-button" aria-label="Choose Cavalry app">
            📁
          </button>
        </div>

        <p class="current-row">Current: <strong id="currentLanguage">English</strong></p>

        <label class="field">
          <span>Language</span>
          <select id="languageSelect"></select>
        </label>

        <div class="actions">
          <button id="applyButton" type="button" class="primary">Apply &amp; Restart</button>
          <button id="extractButton" type="button" class="secondary">Refresh English snapshot</button>
        </div>

        <section class="status-panel">
          <p class="status-label">Status</p>
          <p id="statusText" class="status-text">Ready.</p>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
